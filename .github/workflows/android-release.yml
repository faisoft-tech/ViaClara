# Production Android APK.
#
# Runs on every push to master that contains a commit whose message includes
# "[PROD]" (any commit of the push, not only the last one), or manually from
# the Actions tab. Builds a signed release APK from a clean `expo prebuild`,
# keeps it as a workflow artifact and publishes it as a GitHub Release.
#
# Required repository secrets (see docs/ANDROID_RELEASE.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional repository variable:
#   EXPO_PUBLIC_API_URL (defaults to the dev API below)
name: Android production APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[PROD]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://gvwoz8hj00.execute-api.eu-central-1.amazonaws.com' }}

    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/ANDROID_RELEASE.md)"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and name the APK
        id: apk
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          echo "$CERTS"
          if echo "$CERTS" | grep -q "Android Debug"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          VERSION="$(node -p "require('./app.json').expo.version")"
          NAME="viaclara-${VERSION}-${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" \
            --title "Android ${{ steps.apk.outputs.tag }}" \
            --notes "APK de producción generado desde ${{ github.sha }} (build ${{ github.run_number }})."
