<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <rect width="390" height="844" fill="#FAFAFC"/>

  <!-- status bar -->
  <g id="status-bar">
    <text x="24" y="32" font-family="Poppins" font-size="15" font-weight="700" fill="#17194B">9:41</text>
    <g fill="#17194B">
      <rect x="330" y="20" width="3" height="9" rx="1"/>
      <rect x="335" y="17" width="3" height="12" rx="1"/>
      <rect x="340" y="14" width="3" height="15" rx="1"/>
      <path d="M350 22 a6 6 0 0 1 11 0" stroke="#17194B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="355.5" cy="25.5" r="1.6"/>
      <rect x="366" y="17" width="18" height="10" rx="2.5" stroke="#17194B" stroke-width="1.5" fill="none"/>
      <rect x="368" y="19" width="12" height="6" rx="1" fill="#17194B"/>
      <rect x="384.5" y="20" width="1.6" height="4" rx="0.8"/>
    </g>
  </g>

  <!-- header -->
  <g id="header">
    <path d="M28 66 l-9 9 9 9" stroke="#17194B" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="82" text-anchor="middle" font-family="Poppins" font-size="18" font-weight="600" fill="#17194B">Privacidad y datos</text>
    <rect x="0" y="112" width="390" height="1" fill="#EEEEEE"/>
  </g>

  <!-- card -->
  <g id="card">
    <rect x="18" y="132" width="354" height="145" rx="16" fill="#0A2A33" opacity="0.05"/>
    <rect x="16" y="130" width="358" height="145" rx="16" fill="#FFFFFF"/>

    <!-- row: terms (expanded) -->
    <g id="row-terms">
      <!-- document-text-outline icon -->
      <g transform="translate(32,155)" stroke="#3D69FE" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 1 h8 l5 5 v11 a1 1 0 0 1 -1 1 H3 a1 1 0 0 1 -1 -1 Z"/>
        <path d="M10 1 v5 h5"/>
        <path d="M5 10 h6 M5 13.5 h6"/>
      </g>
      <text x="64" y="165" font-family="Poppins" font-size="14" font-weight="500" fill="#17194B">Términos de uso</text>
      <!-- chevron-up -->
      <path d="M344 163 l6 -6 6 6" stroke="#7D7E88" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text id="answer-terms" x="32" y="196" font-family="Poppins" font-size="12" font-weight="400" fill="#7D7E88">Documento no disponible en esta demo.</text>

    <!-- divider -->
    <rect x="32" y="216" width="326" height="1" fill="#EEEEEE"/>

    <!-- row: policy (collapsed) -->
    <g id="row-policy">
      <!-- shield-checkmark-outline icon -->
      <g transform="translate(32,238)" stroke="#3D69FE" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 1 l7 2.5 v6 c0 4.5 -3 7.5 -7 9 c-4 -1.5 -7 -4.5 -7 -9 v-6 Z"/>
        <path d="M5.5 9.5 l2.5 2.5 4.5 -5"/>
      </g>
      <text x="64" y="248" font-family="Poppins" font-size="14" font-weight="500" fill="#17194B">Política de privacidad</text>
      <!-- chevron-down -->
      <path d="M344 245 l6 6 6 -6" stroke="#7D7E88" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
