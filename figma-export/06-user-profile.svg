<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A2A33" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Frame background -->
  <rect id="frame-bg" x="0" y="0" width="390" height="844" fill="#FAFAFC"/>

  <!-- Status bar -->
  <g id="status-bar">
    <text x="24" y="32" font-family="Poppins" font-weight="700" font-size="15" fill="#17194B">9:41</text>
    <!-- signal -->
    <g fill="#17194B">
      <rect x="330" y="24" width="3" height="8" rx="1"/>
      <rect x="335" y="21" width="3" height="11" rx="1"/>
      <rect x="340" y="18" width="3" height="14" rx="1"/>
    </g>
    <!-- wifi -->
    <path d="M348 22 a9 9 0 0 1 12 0 M351 25 a5 5 0 0 1 6 0" stroke="#17194B" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="354" cy="29" r="1.3" fill="#17194B"/>
    <!-- battery -->
    <rect x="364" y="21" width="20" height="10" rx="2.5" stroke="#17194B" stroke-width="1.3" fill="none"/>
    <rect x="366" y="23" width="14" height="6" rx="1" fill="#17194B"/>
    <rect x="385" y="24" width="1.6" height="4" rx="0.8" fill="#17194B"/>
  </g>

  <!-- Navigation header (Stack.Screen title = name) -->
  <g id="nav-header">
    <path d="M28 66 l-8 8 l8 8" stroke="#17194B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="195" y="80" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="17" fill="#17194B">María J.</text>
    <rect x="0" y="98" width="390" height="1" fill="#EEEEEE"/>
  </g>

  <!-- Hero: avatar + name + municipality -->
  <g id="hero">
    <circle id="avatar" cx="195" cy="176" r="38" fill="#12B3AE"/>
    <text x="195" y="184" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="20" fill="#FFFFFF">MJ</text>
    <text x="195" y="242" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="#17194B">María J.</text>
    <g id="municipality-row">
      <!-- location pin -->
      <path d="M186 258 c0 -4 3 -7 6 -7 s6 3 6 7 c0 4 -6 10 -6 10 s-6 -6 -6 -10 z" fill="none" stroke="#7D7E88" stroke-width="1.4"/>
      <circle cx="192" cy="258" r="2" fill="#7D7E88"/>
      <text x="203" y="263" font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">Almuñécar, Granada</text>
    </g>
  </g>

  <!-- Points / tier card -->
  <g id="points-card">
    <rect x="16" y="294" width="358" height="120" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="32" y="324" font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">Puntos acumulados</text>
    <text x="32" y="356" font-family="Poppins" font-weight="800" font-size="26" fill="#17194B">128</text>

    <!-- tier badge (silver) -->
    <g id="tier-badge">
      <rect x="242" y="312" width="116" height="30" rx="15" fill="#EEF1F4"/>
      <!-- ribbon icon -->
      <circle cx="257" cy="325" r="5" fill="none" stroke="#5B6672" stroke-width="1.5"/>
      <path d="M254 330 l-2 6 l5 -3 l5 3 l-2 -6" fill="none" stroke="#5B6672" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="270" y="331" font-family="Epilogue" font-weight="700" font-size="12" fill="#5B6672">Nivel Plata</text>
    </g>

    <!-- progress track + fill (52%) -->
    <rect id="progress-track" x="32" y="372" width="326" height="8" rx="4" fill="#EEEEEE"/>
    <rect id="progress-fill" x="32" y="372" width="169" height="8" rx="4" fill="#3D69FE"/>
    <text x="32" y="402" font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">72 puntos más para nivel Oro</text>
  </g>

  <!-- Stats row -->
  <g id="stats-row">
    <g id="stat-reports">
      <rect x="16" y="422" width="114" height="62" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="73" y="452" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="#17194B">3</text>
      <text x="73" y="470" text-anchor="middle" font-family="Epilogue" font-weight="600" font-size="10" letter-spacing="0.5" fill="#7D7E88">AVISOS</text>
    </g>
    <g id="stat-resolved">
      <rect x="138" y="422" width="114" height="62" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="195" y="452" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="#17194B">1</text>
      <text x="195" y="470" text-anchor="middle" font-family="Epilogue" font-weight="600" font-size="10" letter-spacing="0.5" fill="#7D7E88">RESUELTOS</text>
    </g>
    <g id="stat-likes">
      <rect x="260" y="422" width="114" height="62" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="317" y="452" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="#17194B">58</text>
      <text x="317" y="470" text-anchor="middle" font-family="Epilogue" font-weight="600" font-size="10" letter-spacing="0.5" fill="#7D7E88">ME GUSTA</text>
    </g>
  </g>
</svg>
