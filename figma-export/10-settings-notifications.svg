    <g id="row-likes">
      <text x="32" y="155" font-family="Poppins" font-size="14" font-weight="500" fill="#17194B">Nuevos me gusta</text>
      <g id="toggle-likes">
        <rect x="314" y="137" width="44" height="26" rx="13" fill="#3D69FE"/>
        <circle cx="345" cy="150" r="11" fill="#FFFFFF"/>
      </g>
      <rect x="32" y="178" width="326" height="1" fill="#EEEEEE"/>
    </g>

    <g id="row-comments">
