        <rect x="314" y="249" width="44" height="26" rx="13" fill="#3D69FE"/>
        <circle cx="345" cy="262" r="11" fill="#FFFFFF"/>
      </g>
      <rect x="32" y="290" width="326" height="1" fill="#EEEEEE"/>
