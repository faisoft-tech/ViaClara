<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <rect id="frame-bg" width="390" height="844" fill="#FAFAFC"/>

  <g id="status-bar">
    <text x="24" y="32" font-family="Poppins" font-size="15" font-weight="700" fill="#17194B">9:41</text>
    <g id="status-icons" fill="#17194B">
      <rect x="334" y="20" width="3" height="9" rx="1"/>
      <rect x="339" y="17" width="3" height="12" rx="1"/>
      <rect x="344" y="14" width="3" height="15" rx="1"/>
      <path d="M352 18c3-3 8-3 11 0l-1.5 1.5c-2.2-2.2-5.8-2.2-8 0z"/>
      <path d="M354.5 21c1.6-1.6 4.4-1.6 6 0l-3 3z"/>
      <rect x="366" y="16" width="20" height="11" rx="2.5" stroke="#17194B" stroke-width="1.2" fill="none"/>
      <rect x="367.5" y="17.5" width="15" height="8" rx="1.2"/>
      <rect x="387" y="19" width="1.6" height="5" rx="0.8"/>
    </g>
  </g>

  <g id="header">
