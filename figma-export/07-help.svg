<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A2A33" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Frame background -->
  <rect id="frame-bg" x="0" y="0" width="390" height="920" fill="#FAFAFC"/>

  <!-- ===== Status bar ===== -->
  <g id="status-bar">
    <text x="24" y="32" font-family="Poppins" font-weight="700" font-size="15" fill="#17194B">9:41</text>
    <g id="status-icons" fill="#17194B">
      <!-- signal -->
      <rect x="332" y="22" width="3" height="10" rx="1"/>
      <rect x="337" y="19" width="3" height="13" rx="1"/>
      <rect x="342" y="16" width="3" height="16" rx="1"/>
      <!-- wifi -->
      <path d="M350 22 a7 7 0 0 1 12 0 l-2 2 a4.5 4.5 0 0 0 -8 0 z"/>
      <circle cx="356" cy="29" r="1.6"/>
      <!-- battery -->
      <rect x="366" y="19" width="20" height="11" rx="3" stroke="#17194B" stroke-width="1.2" fill="none"/>
      <rect x="387" y="22" width="1.6" height="5" rx="0.8"/>
      <rect x="368" y="21" width="15" height="7" rx="1.5"/>
    </g>
  </g>

  <!-- ===== Nav header ===== -->
  <g id="nav-header">
    <rect x="0" y="50" width="390" height="44" fill="#FAFAFC"/>
    <path d="M28 65 l-8 7 l8 7" stroke="#3D69FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="195" y="78" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="17" fill="#17194B">Ayuda</text>
    <rect x="0" y="93.5" width="390" height="1" fill="#EEEEEE"/>
  </g>

  <!-- ===== FAQ section ===== -->
  <g id="section-faq">
    <text x="20" y="124" font-family="Epilogue" font-weight="700" font-size="12" letter-spacing="0.5" fill="#7D7E88">PREGUNTAS FRECUENTES</text>

    <g id="card-faq">
      <rect x="16" y="136" width="358" height="228" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="136" width="358" height="228" rx="16" fill="#FFFFFF"/>

      <!-- FAQ 1 (open) -->
      <g id="faq-1">
        <text x="32" y="167" font-family="Poppins" font-weight="500" font-size="14" fill="#17194B">¿Cómo reporto una incidencia?</text>
        <path d="M346 165 l6 -6 l6 6" stroke="#7D7E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">
          <tspan x="32" y="203">Pulsa el botón central de la barra inferior, añade una</tspan>
          <tspan x="32" y="222">foto, elige la categoría, describe el problema y</tspan>
          <tspan x="32" y="241">confirma la ubicación.</tspan>
        </text>
        <rect x="16" y="256" width="358" height="1" fill="#EEEEEE"/>
      </g>

      <!-- FAQ 2 (closed) -->
      <g id="faq-2">
        <text x="32" y="288" font-family="Poppins" font-weight="500" font-size="14" fill="#17194B">¿Cómo sé si se ha resuelto?</text>
        <path d="M346 285 l6 6 l6 -6" stroke="#7D7E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="16" y="308" width="358" height="1" fill="#EEEEEE"/>
      </g>

      <!-- FAQ 3 (closed) -->
      <g id="faq-3">
        <text x="32" y="340" font-family="Poppins" font-weight="500" font-size="14" fill="#17194B">¿Puedo reportar sin crear una cuenta?</text>
        <path d="M346 337 l6 6 l6 -6" stroke="#7D7E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- ===== System help centre (bug report) ===== -->
  <g id="section-help-centre">
    <text x="20" y="396" font-family="Epilogue" font-weight="700" font-size="12" letter-spacing="0.5" fill="#7D7E88">CENTRO DE AYUDA DEL SISTEMA</text>

    <g id="card-help-centre">
      <rect x="16" y="408" width="358" height="146" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="408" width="358" height="146" rx="16" fill="#FFFFFF"/>

      <!-- bug input -->
      <rect x="32" y="420" width="326" height="70" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1"/>
      <text x="44" y="440" font-family="Poppins" font-weight="400" font-size="14" fill="#7D7E88">Cuéntanos qué ha fallado…</text>

      <!-- submit button -->
      <rect x="32" y="498" width="326" height="44" rx="12" fill="#3D69FE"/>
      <text x="195" y="525" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="12" fill="#FFFFFF">Enviar a los administradores</text>
    </g>
  </g>

  <!-- ===== Council contact info ===== -->
  <g id="section-contact">
    <text x="20" y="586" font-family="Epilogue" font-weight="700" font-size="12" letter-spacing="0.5" fill="#7D7E88">CONTACTO DEL AYUNTAMIENTO</text>

    <g id="card-contact">
      <rect x="16" y="598" width="358" height="150" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="598" width="358" height="150" rx="16" fill="#FFFFFF"/>

      <text x="32" y="629" font-family="Poppins" font-weight="500" font-size="14" fill="#17194B">Ayuntamiento de Almuñécar</text>

      <text font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">
        <tspan x="32" y="668">Consulta el teléfono y correo de atención ciudadana</tspan>
        <tspan x="32" y="687">en la web oficial del ayuntamiento de Almuñécar.</tspan>
      </text>
    </g>
  </g>

  <!-- ===== How ViaClara works ===== -->
  <g id="section-how-it-works">
    <text x="20" y="780" font-family="Epilogue" font-weight="700" font-size="12" letter-spacing="0.5" fill="#7D7E88">CÓMO FUNCIONA VIACLARA</text>

    <g id="card-how-it-works">
      <rect x="16" y="792" width="358" height="112" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="792" width="358" height="112" rx="16" fill="#FFFFFF"/>

      <text font-family="Poppins" font-weight="400" font-size="12" fill="#7D7E88">
        <tspan x="32" y="820">Reporta un problema con una foto y su ubicación, tu</tspan>
        <tspan x="32" y="839">ayuntamiento lo revisa y lo resuelve, y tú confirmas</tspan>
        <tspan x="32" y="858">cuando esté solucionado. Cuanto más participas, más</tspan>
        <tspan x="32" y="877">sube tu nivel de vecino.</tspan>
      </text>
    </g>
  </g>
</svg>
